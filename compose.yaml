name: fsi

x-logging:
  &fsi-logging
  options:
    max-size: "2000k"
  driver: json-file

services:

  fsi-server:
    image: ${FSI_SERVER_IMAGE}:${FSI_SERVER_IMAGE_TAG}
    restart: always
    container_name: fsi-server
    environment:
      - SOLR_SERVER_URI=${SOLR_SERVER_URI}
      - LOG_FSI_LEVEL=${LOG_FSI_LEVEL}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - ${FSI_CONFIG_PATH}:/srv/fsi/mounts/config
      - ${ASSET_PATH}:/srv/fsi/mounts/assets
      - ${OVERLAY_PATH}:/srv/fsi/mounts/overlay
      - ${STORAGE_PATH}:/srv/fsi/mounts/storage
      - ${LOG_PATH}/fsi:/srv/fsi/mounts/catalina/logs
    depends_on:
      solr-server:
        condition: service_healthy
    logging: *fsi-logging
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  solr-server:
    image: solr:9-slim
    restart: always
    container_name: solr
    profiles: [search]
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    command: ["/opt/solr/bin/solr", "start", "-p", "8983", "-f", "-force"]
    volumes:
      - ${SOLR_PATH}:/opt/solr/server/solr/fsi-server
    logging: *fsi-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "solr", "healthcheck", "-p", "8983"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:${CADDY_IMAGE_TAG}
    container_name: caddy
    profiles: [proxy]
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SERVER_DOMAINS=${SERVER_DOMAINS}
    volumes:
      - ./conf/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      fsi-server:
        condition: service_healthy
    logging: *fsi-logging

  lsyncd:
    build: container/lsyncd
    profiles: [mirror]
    restart: always
    container_name: lsyncd
    env_file:
      - .env
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - ./conf/lsyncd/lsyncd.conf.lua:/config/lsyncd.lua:ro
      - ${SYNC_KEY}:/sync.key:ro
      - ${ASSET_PATH}:${ASSET_PATH}:ro
      - ${OVERLAY_PATH}:${OVERLAY_PATH}:ro
      - ${STORAGE_PATH}:${STORAGE_PATH}:ro
      - ${LOG_PATH}/lsync:/var/log
    #      - ${FSI_CONFIG_PATH}:${FSI_CONFIG_PATH}:ro
    logging: *fsi-logging

volumes:
  caddy_data:
  caddy_config:
